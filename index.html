<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A little desert-themed jumping game.">
        <title>Desert Run</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap">        
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <main class="game-container">
            <section id="game" aria-label="Desert Run">
                <header class="game-display">
                    <div class="game-name">
                        <p class="description">JUMPING GAME</p>
                        <h1>Desert Run</h1>
                    </div>
                    <p id="score">Score: 0</p>
                </header>

                <div class="game-background" aria-hidden="true">
                    <span class="sun"></span>
                    <span class="cloud cloud-one"></span>
                    <span class="cloud cloud-two"></span>
                    <span class="dune dune-back"></span>
                    <span class="dune dune-front"></span>
                </div>

                <p id="message">Press SPACE to start!</p>
                <div id="player" aria-hidden="true"></div>
            </section>

            <p class="controls">
                Press <kbd>SPACE</kbd> or <kbd>↑</kbd> to jump
            </p>
        </main>
        
        <script src="script.js"></script>
    </body>
</html>
